plugins {
    id 'com.android.application' version '8.2.2'
}

android {
    namespace 'com.dismal.launcher3plus'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dismal.launcher3plus'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        vectorDrawables.useSupportLibrary = true
    }

    sourceSets {
        main {
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            manifest.srcFile 'src/AndroidManifest.xml'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Keep Kotlin's split JDK 7/8 artifacts aligned with stdlib. Newer stdlib versions
    // already contain those classes, so mixing with older split artifacts causes D8
    // duplicate-class failures.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.palette:palette:1.0.0'
}
